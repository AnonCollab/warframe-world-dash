name: static-data

# Refreshes the dashboard's reference tables: the language dictionary,
# regions and challenges from the world state API's staticData section
# (fetch-static-data.py), and the WFCD open-data tables the translator
# joins against the live feed — bounty reward pools, sortie data, the
# Steel Path rotation, conclave challenges (fetch-reference-data.py).
# The fetch scripts validate before writing and this workflow only
# commits when the canonical bytes actually changed, so game updates
# and hotfix string changes land on their own and quiet weeks produce
# no commits. fetch-static-data.py also captures the raw worldState to
# fixtures/last-seen-active.json whenever a pull catches global
# upgrades or persistent enemies active (both are empty almost all of
# the time). Runs on main: the scripts and workflow themselves are code
# and change through the normal branch flow; this job only ever commits
# the data files it generates.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate the static tables
        run: python3 tools/fetch-static-data.py static-data.json
      - name: Fetch and validate the reference tables
        run: python3 tools/fetch-reference-data.py reference-data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-data.json reference-data.json
          if [ -f fixtures/last-seen-active.json ]; then git add fixtures/last-seen-active.json; fi
          git diff --cached --quiet || git commit -m "Refresh static reference data"
          git push
